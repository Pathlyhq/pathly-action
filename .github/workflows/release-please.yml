# Keeps a "chore(main): release x.y.z" PR up to date (CHANGELOG.md + version).
# Merging it creates the vX.Y.Z tag and the GitHub release, then publishes
# that tag. The publish job lives in this workflow (not on "push: tags")
# because a tag created with GITHUB_TOKEN does not trigger other workflows.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Users pin `uses: Pathlyhq/pathly-action@v1`: the major tag follows each
  # release. dist/ is committed, so the tag needs no build.
  move-major-tag:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          major="${TAG%%.*}"
          git tag -f "${major}" "${TAG}"
          git push -f origin "refs/tags/${major}"
